[tool.poetry]
name = "figurelab-backend"
version = "0.1.0"
description = "FigureLab backend: datasets, FigureSpec compiler, AI providers, export."
authors = ["FigureLab <dev@figurelab.local>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.110,<1.0"
uvicorn = ">=0.29,<1.0"
pandas = ">=2.2,<3.0"
numpy = ">=1.26,<3.0"
plotly = ">=5.20,<6.0"
pydantic = ">=2.6,<3.0"
python-multipart = ">=0.0.9,<1.0"
openpyxl = ">=3.1,<4.0"
xlrd = ">=2.0,<3.0"
httpx = ">=0.27,<0.28"
kaleido = "0.2.1"
python-dotenv = ">=1.0,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.1,<9.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
